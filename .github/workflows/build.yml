name: Build MAUI Android APK

on:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install MAUI Workloads
        run: dotnet workload install maui-android --source https://api.nuget.org/v3/index.json

      - name: Clean Project
        run: dotnet clean NotasApp.sln

      - name: Restore Dependencies
        run: dotnet restore NotasApp.sln --force

      - name: Build Android APK
        run: dotnet publish NotasApp.csproj -c Release -f net8.0-android --no-restore /p:AndroidPackageFormat=apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotasApp-APK
          path: |
            **/bin/Release/net8.0-android/*.apk
